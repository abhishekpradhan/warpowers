name: Feature request
description: Propose a change to the game, the content pipeline or the tools.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, skim `docs/roadmap.md` in the repository: it lists what is
        being worked on and what is deliberately not planned (multiplayer, a third
        faction, mobile, accounts). Proposals that fit `docs/vision.md` and the
        creative bible in `docs/creative.md` are the easiest to say yes to.
  - type: textarea
    id: problem
    attributes:
      label: What is the player or contributor problem?
      description: Describe the situation, not the solution. Where in a match or in the workflow does it bite, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you add or change, and how would a player notice? For gameplay, name the faction, unit, structure or mission involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing nothing.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay and balance
        - Missions and campaign
        - Command interface and controls
        - Art, audio and presentation
        - Web shell, settings and persistence
        - Tools and content pipeline
        - Engine
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require retail game assets, EA names or data derived from them.
          required: true
        - label: I checked the roadmap's "Not planned" section.
          required: true
