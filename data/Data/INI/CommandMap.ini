; War Powers key bindings (CommandMap). Names from MetaEvent.cpp tables.
; KEY_NONE + Modifiers entries fire on modifier-state change (retail's
; Ctrl-hold force-attack pattern). DOUBLEDOWN is dead code in the engine
; matcher - never use it.

