; War Powers original data - command sets.
;
; Slot layout: the control bar shows two rows of nine (slots 1-9 and 10-18).
; Builders list economy and production structures on the first row and
; defenses on the second, in the order a match usually needs them.
; Headquarters produce the builder and infantry only; vehicles come from the
; Vehicle Plant / Chop Shop and aircraft from the Launch Pad / Roost.
; Hotkeys are the "&" letters in the button labels (Data/Generals.str).
