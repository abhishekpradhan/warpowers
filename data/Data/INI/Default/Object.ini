; Map-wide weather bed carrier. tools/genmap.py places exactly one per map at
; the playable centre, neutral-owned. WP_AMB_Wind is a looping Limit 1 world
; event and Drawable::updateDrawable re-requests a non-playing looping ambient
; every frame, so a second carrier (it used to ride on both command centers)
; is rejected by GameSounds ~30x/s for the whole match. Invisible (Model NONE),
; inert, unattackable, passable and unselectable: never scored, counted for
; victory, targeted, or seen by build placement and script counters.
