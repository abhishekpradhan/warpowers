; War Powers original data - EVA command-net announcer.
; Event names must match TheEvaMessageNames in Eva.cpp. SideSounds Side must
; match the PlayerTemplate Side of the listening player (WP / WPJ).

EvaEvent LOWPOWER
  Priority = 4
  TimeBetweenChecksMS = 45000
  ExpirationTimeMS = 5000
  SideSounds
    Side = WP
    Sounds = WP_EVA_LowPower
  End
  SideSounds
    Side = WPJ
    Sounds = WP_EVA_LowPower
  End
End

