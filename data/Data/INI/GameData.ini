; War Powers original data stub (zero-retail boot slice)
;
; Dataset switches for engine behaviour the War Powers fork added. The engine
; defaults keep retail data unchanged; this file (loaded after
; Default/GameData.ini, overwriting only the fields listed) opts War Powers in.
GameData
  RallyPointModel = WPNODE01                 ; rally-point node model (retail: SCMNode)
  RallyPointLineTexture = wp_rallyline.tga   ; rally line texture (retail: EXLaser.tga)
  DozerResumesAbandonedConstruction = Yes    ; idle builders resume nearby abandoned sites
  MapPlacedHarvestersAutoGather = Yes        ; map-placed Porters/Scavengers gather at match start
  CommandButtonAvailabilityCues = Yes        ; lock badge / brightened command portraits
  ; Background music: audio events from Music.ini, played in this order with a pause between tracks.
  MusicRotation = Track_WP_01 Track_WP_02 Track_WP_03 Track_WP_04 Track_WP_05 Track_WP_06
End
