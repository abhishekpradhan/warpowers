Locomotor WP_HoverLocomotor
  Surfaces = AIR
  Speed = 55
  TurnRate = 120
  Acceleration = 90
  Braking = 90
  Lift = 160
  PreferredHeight = 55
  PreferredHeightDamping = 1.0
  SpeedLimitZ = 30
  ; Flying locomotors MUST opt in to mid-air control: without
  ; AllowAirborneMotiveForce the engine skips the ENTIRE 2D move dispatch
  ; for airborne objects (the gate exists so jumping ground vehicles can't
  ; steer in the air) - the craft climbs and then parks in the sky.
  AllowAirborneMotiveForce = Yes
  ; THE hover stabilizer: 2D velocity is force-integrated and only friction
  ; sheds sideways momentum - without it hover craft ice-skate past their
  ; goals in giant drifting orbits. Needs the airborne opt-in too or the
  ; friction never applies in flight.
  Extra2DFriction = 2.0
  Apply2DFrictionWhenAirborne = Yes
  ZAxisBehavior = SURFACE_RELATIVE_HEIGHT
  Appearance = HOVER
End

