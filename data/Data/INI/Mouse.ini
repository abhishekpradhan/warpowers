; War Powers original data - mouse behavior.
; DragTolerance* are ZERO-DEFAULT TRAPS: with them unset, Mouse::isClick()
; treats every real click as a drag, which silently disables right-click
; cancel of building placement (and any other click-vs-drag test).
; DragTolerance is in game pixels (1600x900 canvas): a right press that moves
; less than this and lasts under DragToleranceMS is an order, not a camera pan.
Mouse
  DragTolerance = 20
  DragTolerance3D = 20
  DragToleranceMS = 300
  TooltipFontSize = 12
  TooltipDelayTime = 50
End
