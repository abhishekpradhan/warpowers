; War Powers original data - mouse behavior.
; DragTolerance* are ZERO-DEFAULT TRAPS: with them unset, Mouse::isClick()
; treats every real click as a drag, which silently disables right-click
; cancel of building placement (and any other click-vs-drag test).
Mouse
  DragTolerance = 10
  DragTolerance3D = 20
  DragToleranceMS = 300
  TooltipFontSize = 12
  TooltipDelayTime = 50
End
