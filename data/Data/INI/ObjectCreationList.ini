; Native, deterministic effects for the two original commander abilities.
ObjectCreationList WP_OCL_PrecisionStrike
  CreateObject
    ObjectNames = WP_StrikeBeacon
    Count = 1
    Disposition = ON_GROUND_ALIGNED
    IgnorePrimaryObstacle = Yes
  End
End

ObjectCreationList WP_OCL_TunnelAmbush
  CreateObject
    ObjectNames = WPJ_Scrapper
    Count = 3
    Disposition = ON_GROUND_ALIGNED
    SpreadFormation = Yes
    MinDistanceAFormation = 10
    MinDistanceBFormation = 10
    MaxDistanceFormation = 25
  End
  CreateObject
    ObjectNames = WPJ_Sting
    Count = 2
    Offset = X:18 Y:12 Z:0
    Disposition = ON_GROUND_ALIGNED
    SpreadFormation = Yes
    MinDistanceAFormation = 10
    MinDistanceBFormation = 10
    MaxDistanceFormation = 25
  End
End

