<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>War Powers</title>
  <style>
    html, body { margin: 0; background: #101116; color: #cfd2dd;
                 font: 12px/1.45 ui-monospace, monospace; }
    #status { position: sticky; top: 0; background: #1a1c26; padding: 8px 12px;
              border-bottom: 1px solid #2a2d3a; font-weight: 600; z-index: 2; }
    #stage { display: flex; justify-content: center; padding: 10px; background: #000; }
    canvas { width: 1024px; height: 768px; background: #000; border: 1px solid #2a2d3a; }
    #log { height: 220px; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap;
           word-break: break-all; border-top: 1px solid #2a2d3a; background: #14151d; }
  </style>
</head>
<body>
  <div id="status">war powers: fetching game data…</div>
  <div id="stage"><canvas id="canvas" width="1024" height="768" oncontextmenu="event.preventDefault()"></canvas></div>
  <div id="log"></div>
  <script>
    var statusEl = document.getElementById('status');
    var logEl = document.getElementById('log');
    var lineCount = 0;
    var pinned = true;
    logEl.addEventListener('scroll', function() {
      pinned = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
    });
    function log(t) {
      lineCount++;
      if (lineCount < 6000) {
        logEl.textContent += t + '\n';
        if (pinned) logEl.scrollTop = logEl.scrollHeight;
      }
      console.log(t);
      statusEl.textContent = 'war powers [' + lineCount + ']: ' + String(t).slice(0, 160);
    }
    window.addEventListener('error', function(e) {
      log('UNCAUGHT: ' + (e.error && e.error.stack ? e.error.stack : e.message));
    });
    window.addEventListener('unhandledrejection', function(e) {
      log('REJECTION: ' + e.reason + '\n' + (e.reason && e.reason.stack ? e.reason.stack : ''));
    });

    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) { return path + '?v=' + Date.now(); },
      // Boot straight into the Boot Slice match. Extra args via ?args=a,b
      arguments: ['-win', '-noshellmap', '-file', 'Maps/WPTest.map'].concat(
        (new URLSearchParams(location.search).get('args') || '')
          .split(',').filter(function(a) { return a.length > 0; })),
      print: log,
      printErr: log,
      onAbort: function(w) { log('ABORT: ' + w); },
      preRun: [function() {
        ENV.CNC_GENERALS_ZH_PATH = '/game';
        ENV.CNC_GENERALS_PATH = '/game-base';
        ENV.HOME = '/home/web_user';
        FS.mkdir('/game');
        FS.mkdir('/game-base');
        FS.mkdir('/fonts');
        var userDir = '/home/web_user/.local/share/GeneralsX/GeneralsZH';
        FS.mkdirTree(userDir);
        FS.writeFile(userDir + '/Options.ini',
          'StaticGameLOD = Low\n' +
          'UseShadowVolumes = no\n' +
          'UseShadowDecals = no\n' +
          'Resolution = 1024 768\n');
        addRunDependency('gamedata');
        var staged = 0, total = 0;
        fetch('gamedata/manifest.json').then(function(r) {
          if (!r.ok) throw new Error('manifest: HTTP ' + r.status);
          return r.json();
        }).then(function(files) {
          total = files.length + 1;
          function done() { if (++staged === total) {
            log('[staged] ' + total + ' files; starting engine');
            removeRunDependency('gamedata');
          } }
          // the wasm fontconfig stub resolves every font query here
          fetch('fonts/default.ttf').then(function(r) { return r.arrayBuffer(); })
            .then(function(buf) {
              FS.writeFile('/fonts/default.ttf', new Uint8Array(buf));
              done();
            });
          files.forEach(function(rel) {
            fetch('gamedata/' + rel).then(function(r) {
              if (!r.ok) throw new Error(rel + ': HTTP ' + r.status);
              return r.arrayBuffer();
            }).then(function(buf) {
              var dest = '/game/' + rel;
              FS.mkdirTree(dest.substring(0, dest.lastIndexOf('/')));
              FS.writeFile(dest, new Uint8Array(buf));
              done();
            }).catch(function(err) { log('[stage failed] ' + err); done(); });
          });
        }).catch(function(err) { log('[manifest failed] ' + err); });
      }]
    };
  </script>
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = 'GeneralsXZH.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
